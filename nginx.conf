events {}

http {
  # Upstreams
  upstream cart_backend {
    server cart:3002;
  }

  upstream order_backend {
    server order:3003;
  }

  # ────────────────────────────────────
  # Balanceador principal (nginx)
  # ────────────────────────────────────
  server {
    listen 3002;
    # Todas las rutas de Cart
    location / {
      # CORS para cart
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:8080';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
        add_header 'Access-Control-Max-Age' 1728000;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' 'http://localhost:8080';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';

      proxy_pass http://cart_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 3003;
    # Todas las rutas de Order
    location / {
      # CORS para order
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:8080';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
        add_header 'Access-Control-Max-Age' 1728000;
        return 204;
      }
      add_header 'Access-Control-Allow-Origin' 'http://localhost:8080';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';

      proxy_pass http://order_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # ────────────────────────────────────
  # Balanceador pasivo (nginx-backup)
  # ────────────────────────────────────
  server {
    listen 3004;

    # healthcheck de Cart: reescribe /cart/health → /health
    location = /cart/health {
      rewrite ^/cart/health$ /health break;
      proxy_pass http://cart_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
    }

    # resto de rutas de Cart
    location / {
      proxy_pass http://cart_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
    }
  }

  server {
    listen 3005;
    # todas las rutas de Order
    location / {
      proxy_pass http://order_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      add_header 'Access-Control-Allow-Origin' '*';
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
      add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type';
    }
  }
}
